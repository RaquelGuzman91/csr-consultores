    <!------ SECTION-FORM  -------->
    <section class="formulario">
        <article class="container-formulario">
            <form action="" name="contact-form" id="" method="post">
            <label for="">Nombre<span>*</span></label>
            <input type="text"  name="nombre" inputmode="text" placeholder="Nombre y Apellido" required>
            <main class="grid-label">
                <figure>
                    <label for="">Telefono <span>*</span></label>
                    <input type="tel" name="telefono" inputmode="tel" pattern="\d{8}" maxlength="8" placeholder="Telefono movil" required>
                </figure>
                <figure>
                    <label for="">Correo electronico <span>*</span></label>
                    <input type="email" name="correo" inputmode="email" placeholder="Correo electronico" required>
                </figure>
                <figure>
                    <label for="">Puesto <span>*</span></label>
                    <input type="text" name="puesto" inputmode="text" placeholder="Puesto que desempeña" required>
                </figure>
                <figure>
                    <label for="">Empresa <span>*</span></label>
                    <input type="text" name="empresa" inputmode="text" placeholder="Empresa en que labora" required>
                </figure>
            </main>
            <label class="label-textarea" for="">¿Como podemos ayudarte? <span>*</span></label>
            <textarea name="mensaje" id="" rows="6" placeholder="Describe tu solicitud para que podamos ayudarte de la mejor manera posible" required></textarea>
            <button class="button-form" type="submit">Enviar</button>
        </form>
        </article>
    </section>
